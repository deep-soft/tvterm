# tvterm profile: opens a set of terminals, with their commands, working
# directories, titles and positions.
#
# Usage:
#   tvterm -p example                 (looks for ~/.config/tvterm/profiles/example.ini)
#   tvterm -p /path/to/file.ini
#   or, inside tvterm: Ctrl-B L (Load Profile...)
#
# Lines starting with '#' or ';' are comments.

[profile]
# How to arrange the terminals:
#   auto          'manual' if any terminal has 'pos', otherwise 'tile-columns'
#   manual        use 'pos' (terminals without it fill the desktop)
#   tile-columns  tile, columns first (like Ctrl-B M, Tile (Columns First))
#   tile-rows     tile, rows first
#   cascade       cascade
layout = manual
# Terminal to focus at startup (1 = first). Default: the last one.
focus = 3

# Each [terminal] section opens one terminal. Keys (all optional):
#   title      fixed window title (replaces the one set by programs)
#   dir        working directory ('~' = home directory)
#   command    command to run with your shell ($SHELL -c "command");
#              without it, an interactive shell is started
#   keep-open  yes (default): after the command ends, or is stopped with
#              Ctrl+C, start an interactive shell in the same terminal;
#              no: when the command ends, the terminal keeps showing its
#              output, marked '(Disconnected)' (close it with Ctrl-B W)
#   pos        x y width height, in percent of the desktop

[terminal]
title = Mail log
dir = /var/log
command = tail -f mail.log
pos = 0 0 50 60

[terminal]
title = Mail queue
command = watch -n 10 mailq
pos = 50 0 50 60

[terminal]
title = Files
dir = ~
command = far2l --tty
pos = 0 60 100 40

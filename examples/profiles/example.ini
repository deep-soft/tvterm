# tvterm profile: opens a set of windows (terminals with their commands,
# working directories and titles, editors, the event viewer) and their
# positions. Ctrl-B A (Save Profile As...) saves the current windows in
# this format.
#
# Usage:
#   tvterm -p example                 (looks for ~/.config/tvterm/profiles/example.ini)
#   tvterm -p /path/to/file.ini
#   or, inside tvterm: Ctrl-B L (Load Profile...)
#
# Lines starting with '#' or ';' are comments.

[profile]
# How to arrange the terminals:
#   auto          'manual' if any terminal has 'pos', otherwise 'tile-columns'
#   manual        use 'pos' (terminals without it fill the desktop)
#   tile-columns  tile, columns first (like Ctrl-B M, Tile (Columns First))
#   tile-rows     tile, rows first
#   cascade       cascade
layout = manual
# Window to focus at startup (1 = first section). Default: the last one.
# Windows are stacked in the order of the sections: the last one is in front.
focus = 3

# Each section opens one window: [terminal], [editor] or [eventviewer].
# All of them accept (optional):
#   pos        x y width height, in percent of the desktop (decimals allowed)
#
# [terminal] keys (all optional):
#   title      fixed window title (replaces the one set by programs)
#   dir        working directory ('~' = home directory)
#   command    command to run with your shell ($SHELL -c "command");
#              without it, an interactive shell is started
#   keep-open  yes (default): after the command ends, or is stopped with
#              Ctrl+C, start an interactive shell in the same terminal;
#              no: when the command ends, the terminal keeps showing its
#              output, marked '(Disconnected)' (close it with Ctrl-B W)
#
# [editor] keys (optional):
#   file       file to open; without it, an empty 'Untitled' editor
#
# [eventviewer] has only 'pos'.

[terminal]
title = Mail log
dir = /var/log
command = tail -f mail.log
pos = 0 0 50 60

[terminal]
title = Mail queue
command = watch -n 10 mailq
pos = 50 0 50 60

[terminal]
title = Files
dir = ~
command = far2l --tty
pos = 0 60 100 40

# An editor for notes, on top of the 'Files' terminal:
# [editor]
# file = ~/notes.txt
# pos = 60 60 40 40

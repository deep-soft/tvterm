# Highlight sets for Log View that are not built into tvterm (until E45 they
# were): sets for one particular setup (Zimbra, a FortiGate with its own
# policy names), ready to copy into ~/.config/tvterm/tvterm.ini and adapt.
#
# Copy a whole section ([highlight NAME] and its rules) to the end of
# tvterm.ini, e.g. in the Settings editor (Ctrl-B More... Edit settings); it is
# active as soon as the file is saved. The sets use the built-in sets levels,
# timestamps, kv, syslog and fail2ban (include = ...): with
# '[logview] builtin-highlight = no' copy those too
# (tvterm --print-highlight levels timestamps kv syslog fail2ban).
# Rules and colors: docs/MANUAL.md, chapter 10 (Colors (highlight)).

# Postfix / amavis (zimbra.log, maillog): red status=bounced, reject:,
# NOQUEUE, SASL ... authentication failed; yellow status=deferred, warning:;
# green status=sent, Passed CLEAN; each queue-ID in its own color.
[highlight zimbra-mta]
match = bright-red "status=bounced"
match = bright-red "reject:"
match = bright-red "NOQUEUE"
match = bright-red "SASL [A-Z0-9-]+ authentication failed"
match = bright-yellow "status=deferred"
match = bright-yellow "warning:"
match = bright-green "status=sent"
match = bright-green "Passed CLEAN"
hash = "]: ([0-9A-F]{8,12}): "
hash = "queued as ([0-9A-F]{8,12})"
hash = "Queue-ID: ([0-9A-F]{8,12})"
include = syslog
include = kv

# Zimbra mailbox.log: ESMTP, IMAPS, Ban, reject:, <a> -> <b>...
[highlight zimbra-mailbox]
groups = bright-red "(ESMTP)"
groups = bright-green "(IMAPS)"
groups = bright-red " (Ban)"
groups = bright-red " (reject:)"
groups = bright-magenta " (Hop count exceeded)"
groups = bright-green " (Delivery OK)"
groups = bright-cyan "( <[^>]*@[^>]*> -> <[^>]*@[^>]*> )"
include = levels
include = timestamps
include = kv

# FortiGate: srccountry (Reserved and one country on blue, the others on red),
# srcip=, the names of the policies (change them to yours), SMTPS / IMAPS.
[highlight fortigate]
groups = bright-cyan on blue " (srccountry=\"Reserved\")"
groups = bright-cyan on blue " (srccountry=\"Romania\")"
groups = bright-cyan on red " (srccountry=\"[A-Za-z ]*\")"
groups = bright-cyan " (srcip=)"
groups = bright-red "(VIP-TO-MAIL[^\" ]*BLOCK)"
groups = bright-yellow "(FIP-PERMIT-IN-993)"
groups = bright-red "(FIP-PERMIT-IN-465)"
groups = bright-red "(SMTPS)"
groups = bright-green "(IMAPS)"
include = levels
include = timestamps
include = kv

# fail2ban with one more rule: the country written by an action (here
# "RO, Romania") in bright blue; the rest as the built-in fail2ban set. A
# new name that ends with include keeps the built-in set as it is. To keep
# the name fail2ban (profiles that use it), copy the built-in set instead
# (tvterm --print-highlight fail2ban) and add the rule to the copy, before
# the line with the IP address: a section with the name of a built-in set
# replaces it.
[highlight fail2ban-ro]
groups = bright-blue " (RO, Romania)"
include = fail2ban

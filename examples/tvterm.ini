## tvterm settings: ~/.config/tvterm/tvterm.ini (or $XDG_CONFIG_HOME/tvterm/tvterm.ini).
## Ctrl-B More... > Edit settings creates this file with every key commented out.
## Lines starting with '#' are comments (spaces before it are allowed). To change
## a value, remove the '#' in front of its key: ' #lines = 10000' becomes
## ' lines = 10000'.
## Changes apply as soon as the file is saved (checked every 2 seconds) or with
## Ctrl-B More... > Reload settings. Invalid values keep their previous value;
## problems are reported in the Event Viewer (Ctrl-B V).

[general]
  # Profile opened when tvterm starts without -p (name or path, see
  # examples/profiles/example.ini). 'tvterm -p none' starts without it.
  # Used only at startup.
 #profile = server-mail
  # Reload this file automatically when it changes.
 #auto-reload = yes
  # After an automatic reload: status ("Settings reloaded." in the status line
  # for 5 seconds) or none. Problems in this file always go to the Event Viewer.
 #reload-message = status
  # Files larger than this ask before they open in tvterm (Save with 'Open
  # after saving', Ctrl-B O, More... View file): K, M or G; 0: never ask.
 #large-file = 5M
  # Programs for files, run in a new terminal window: %f is the full file path
  # (quoted for the shell; without %f, the path is added at the end).
  # More... View file uses external-viewer directly; large files offer both.
  # --mortal: far2l ends with the window (otherwise it stays in the background).
 #external-viewer = far2l --mortal -v %f
 #external-editor = far2l --mortal -e %f
  # Patterns offered by Down in the Name field of the file dialogs (Ctrl-B O,
  # More... View file, the editor's Save file as), separated by spaces, e.g.
  # *.txt *log* *.ini *. The first one is the initial filter of Ctrl-B O and
  # View file. One pattern at a time (* and ?): *.txt|*.log does not work.
 #file-filters = *.txt *
  # Size of the file dialogs (Ctrl-B O, More... View file, Save file as, Load /
  # Save Profile) when they open, columns x rows; smaller if the screen is
  # smaller. Without it, tvision's size. A dialog resized with the mouse (or
  # Ctrl-F5) keeps its size until tvterm exits.
 #file-dialog-size = 120x40
  # Columns of the list of files in those dialogs: 1 shows long names whole
  # (the date and size of the chosen file are on the bottom line), or 2.
 #file-list-columns = 2
  # Shadow under the desktop windows (terminals, Log View, editors, Event
  # Viewer): yes or no. With Tile, the shadow of a window falls on the title
  # of the window below it. Menus and dialogs always have a shadow.
 #window-shadow = no
  # Color of the selected text in the editors, also the text found by Find:
  # <color> on <color> (black red green yellow blue magenta cyan white,
  # bright-<color>), e.g. black on bright-green; default: tvision's color.
 #editor-selection = default

[scrollback]
  # Lines kept per terminal (0 to 100000). About 4 KB per line of 100 columns.
 #lines = 10000
  # Lines scrolled by the mouse wheel.
 #wheel-lines = 3
  # Characters that are part of a word on double click, besides letters and digits.
 #word-chars = -._/@:~+%=
  # Directory proposed when saving the history; empty: the terminal's current directory.
 #save-dir = ~/logs
  # File name proposed when saving (history, screen, Log View):
  # name-first: tvterm-<title>-YYYY-MM-DD-hhmm.txt
  # date-first: YYYY-MM-DD-hhmm-tvterm-<title>.txt
  # The dialog can switch it; the last choice is kept until tvterm exits.
 #save-name = name-first
  # Default of the 'Case sensitive' option when searching.
 #search-case-sensitive = no
  # Shift+click selects text even in programs that use the mouse (e.g. far2l).
 #shift-click-select = yes

[alerts]
  # Title of a window with an alert (terminal or Log View, Ctrl-B A): red
  # (the title text white on red until the window gets the focus) or none
  # (only the mark, e.g. [!], in the title).
 #title-color = red
  # Title of a window that got the focus while it had an alert (Ctrl-B G,
  # a click), until it loses the focus: yellow (black on yellow), cyan
  # or none.
 #seen-color = yellow

[logview]
  # Lines kept by each Log View source (Ctrl-B L), 100 to 1000000; a window
  # can ask for another number. About 1 KB per line of a firewall log.
 #max-lines = 50000
  # The highlight sets built into tvterm (listed below): yes, or no to use only
  # the [highlight] sections of this file.
 #builtin-highlight = yes

  # Highlight sets for Log View (F4 > Highlight sets, e.g. 'syslog kv'; H turns
  # the colors on/off). Built-in sets: levels timestamps kv syslog nginx
  # fail2ban rsync; a section with the same name replaces one (their text:
  # source/tvterm/highlight.cc). More sets, to copy here:
  # examples/highlight-sets.ini (zimbra-mta, zimbra-mailbox, fortigate). Rules,
  # in order (where they overlap, the first one wins):
  #   line   = <color> "<regex>" [icase]   the whole line (first that matches)
  #   match  = <color> "<regex>" [icase]   every match
  #   groups = <color> "<regex>" [icase]   only the text in parentheses
  #   hash   = "<regex>" [icase]           a color derived from the value
  #   include = <set>                      the rules of another set (put it last)
  # Colors: black red green yellow blue magenta cyan white, bright-<color>,
  # optionally 'on <color>' (background). Regular expressions like grep -E;
  # inside the quotes, \" is a quote.
#[highlight my-mail]
 #line = bright-red "status=bounced"
 #groups = bright-yellow on blue "from=<([^>]*)>"
 #hash = "client=[^[]*\[([0-9.]+)\]"
 #include = syslog

  # Transformation sets for Log View (F4 > Transform, e.g. 'show-tls'; T turns
  # them on/off). They change the text shown (the filters and the alerts
  # use the original line). Rules, applied in order, each on the result of
  # the one before:
  #   replace = "<regex>" "<template>" [icase]   every match is replaced
  # Template: \0-\9 the match / a group, ${n:>W} ${n:<W} a group aligned
  # right / left in W characters (${n:>W!} cuts a longer value), \t a tab,
  # \\ a backslash, \$ a dollar; "" removes the match.
  #   fields = k1 k2:>W k3:<W! ...   the values of key=value words, in this
  #   order (key:>W / key:<W aligned right / left in W characters, ! cuts)
  #   fields-format = pairs | values   key=value (default) or only the values
  #   (separated by a tab, by a space when a field has a width)
  # A missing field is left out (with a width: blanks); a line without any of
  # the fields stays as it is. The fields come before the replace rules.
  # Example: the TLS connections of zimbra.log as IP, date, service, name.
#[transform show-tls]
 #replace = "^([^ ]+) +[^ ]+ +[^/]+/([^/[ ]{1,4})[^ ]* .*TLS connection established from ([^[]+)\[([^]]+)\].*" "${4:>15}\t\1\t\2\t\3"
  # Example: FortiGate lines without some fields (like multitail -ke), the
  # second field (the host) in 20 characters, srcip in 15, the ports in 5.
#[transform fortigate-short]
  # The alignments first: the last three rules remove the keys they look for.
 #replace = "^([^ ]+) +([^ ]+) +" "\1 ${2:<20} "
 #replace = "srcip=([0-9.]+)" "srcip=${1:>15}"
 #replace = "dstport=([0-9]+)" "dstport=${1:>5}"
 #replace = "dstintf=\"([^\"]*)\"" "dstintf=\"${1:<6}\""
 #replace = "app=\"([a-z]+)/([0-9]+)\"" "app=\"\1/${2:>5}\""
 #replace = "devname=.* srcip=" ""
 #replace = "srcport=.* dstport=" ""
 #replace = "policytype=.* policyname=" ""
  # Example: FortiGate lines as aligned columns of some fields.
#[transform fortigate-fields]
 #fields = date time srcip:>15 dstip:>15 dstport:<5 action:<7 policyid
 #fields-format = values

[keys]
  # Keys that scroll the history directly (outside of full-screen programs,
  # which receive them as usual). Examples: Alt-Shift-PgUp, Ctrl-F5, none.
 #history-page-up = Alt-Shift-PgUp
 #history-page-down = Alt-Shift-PgDn
 #history-top = Alt-Shift-Home
 #history-bottom = Alt-Shift-End
  # Global keys: they work in every window (not in dialogs, menus or Grab
  # Input). A comma separates several keys; modifiers Ctrl-, Alt-, Shift-;
  # keys F1-F12, Left Right Up Down Home End PgUp PgDn Ins Del, and, with Ctrl
  # or Alt, Tab Enter Backspace Space a-z 0-9 ` (the key left of 1; also
  # written backquote). ':not-far2l' after a key: the key goes to far2l when
  # the focused terminal runs far2l with its extensions.
  # Key that opens the menu (the first one is shown in the status line),
  # e.g. Ctrl-B, Ctrl-`
 #menu-key = Ctrl-B
  # Maximize / restore the focused window (also Ctrl-B Z), e.g. F12:not-far2l
 #key-zoom =
  # Go to the neighbouring window on the left / right / above / below,
  # e.g. Alt-Shift-Left, Alt-Shift-Right, Alt-Shift-Up, Alt-Shift-Down
 #key-window-left =
 #key-window-right =
 #key-window-up =
 #key-window-down =
